<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="webdes.css">
    <title>For my Baby</title>
    <style>
        body {
            background-color: rgb(253, 118, 199);
            text-align: center;
            margin-top: 50px;
            position: relative;
            height: 100vh;
        }

        h1 {
            background-color: rgb(253, 118, 199);
            color: white;
        }

        .pink-btn {
            background-color: rgb(253, 118, 199);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            position: relative;
        }

        .pink-btn:hover {
            background-color: hotpink; /* Darker pink when hovered */
        }

        #noBtn {
            position: absolute;
        }
    </style>
</head>
<body>
    <h1>🩷Will You Marry Me?🩷</h1>
    <button class="pink-btn" onclick="goToPage()">Yes! Yes! Yes! Yes!</button>
    <button class="pink-btn" id="noBtn" onmouseover="moveButton()">Not now but soon</button>

    <script>
        function goToPage() {
            window.location.href = "nextpage.html"; // Replace with your target page
        }

        function moveButton() {
            const noBtn = document.getElementById("noBtn");
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }
    </script>
</body>
</html>
