<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>She Said Yes!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: rgb(253, 118, 199);
    --pink-deep: #c23a86;
    --plum: #5b1f42;
    --cream: #fff5fa;
    --gold: #e8b64c;
  }

  * { box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, var(--pink) 0%, var(--pink-deep) 55%, var(--plum) 100%);
    font-family: 'Poppins', sans-serif;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  /* floating hearts */
  .heart{
    position: absolute;
    bottom: -10%;
    font-size: 1.5rem;
    color: rgba(255,255,255,0.75);
    animation: rise linear infinite;
    user-select: none;
    pointer-events: none;
  }

  @keyframes rise{
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(var(--drift, 20px)) rotate(360deg); opacity: 0; }
  }

  .ring{
    font-size: 4rem;
    animation: pulse 2.2s ease-in-out infinite;
    margin-bottom: 0.5rem;
  }

  @keyframes pulse{
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }

  h1{
    font-family: 'Parisienne', cursive;
    font-size: clamp(3rem, 9vw, 6rem);
    margin: 0 0 0.25rem 0;
    text-shadow: 0 4px 18px rgba(0,0,0,0.25);
  }

  p.subtitle{
    font-weight: 300;
    letter-spacing: 0.04em;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    max-width: 32ch;
    margin: 0 0 2rem 0;
    color: var(--cream);
    opacity: 0.9;
  }

  .date-card{
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 14px;
    padding: 1.25rem 2rem;
    margin-bottom: 2rem;
  }

  .date-card span{
    display: block;
    font-family: 'Poppins', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.4rem;
  }

  .date-card strong{
    font-size: 1.1rem;
    font-weight: 600;
  }

  .cream-btn{
    background: var(--cream);
    color: var(--pink-deep);
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .cream-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.28);
  }
</style>
</head>
<body>

  <div class="ring">💍</div>
  <h1>She Said Yes!</h1>
  <p class="subtitle">Forever starts now. Thank you for saying yes to a lifetime with me.</p>

  <div class="date-card">
    <span>Engaged on</span>
    <strong id="today"></strong>
  </div>

  <button class="cream-btn" onclick="window.location.href='index.html'">Back to the beginning 🩷</button>

  <script>
    // Floating hearts
    const heartSymbols = ["💕","💖","🩷","💗","❤️"];
    for (let i = 0; i < 22; i++) {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.setProperty("--drift", (Math.random() * 80 - 40) + "px");
      heart.style.animationDuration = (6 + Math.random() * 6) + "s";
      heart.style.animationDelay = (Math.random() * 8) + "s";
      heart.style.fontSize = (1 + Math.random() * 1.5) + "rem";
      document.body.appendChild(heart);
    }

    // Today's date
    document.getElementById("today").textContent = new Date().toLocaleDateString(undefined, {
      year: "numeric", month: "long", day: "numeric"
    });
  </script>

</body>
</html>
